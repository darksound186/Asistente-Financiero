<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta charset="UTF-8">
  <title>Control Quincenal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <!-- Vista Principal -->
  <div class="wrap" id="view-inicio">
    <div class="eyebrow">Control financiero</div>
    <h1 id="mainTitle">Quincena en curso</h1>
    <div class="sub">Tu plan, en pesos reales — sin porcentajes genéricos.</div>
    <div id="loading" class="loading">Cargando tus datos…</div>
    <div id="app" class="hidden"></div>
  </div>

  <!-- Navegación Inferior para Móviles -->
  <nav class="mobile-nav" id="mobileNav">
    <button class="mobile-nav-item active" onclick="switchMobileTab('dashboard')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Inicio</span>
    </button>
    <button class="mobile-nav-item" onclick="switchMobileTab('extra')">
      <span class="nav-icon">💰</span>
      <span class="nav-label">Sin Asignar</span>
    </button>
    <button class="mobile-nav-item nav-action-btn" onclick="abrirModalGastoRapido()">
      <span class="nav-icon">➕</span>
      <span class="nav-label">Registrar</span>
    </button>
    <button class="mobile-nav-item" onclick="switchMobileTab('assistant')">
      <span class="nav-icon">🤖</span>
      <span class="nav-label">Asistente</span>
    </button>
    <button class="mobile-nav-item" onclick="switchMobileTab('loans')">
      <span class="nav-icon">🤝</span>
      <span class="nav-label">Préstamos</span>
    </button>
  </nav>
   <button class="mobile-nav-item" onclick="switchMobileTab('settings')">⚙️ Ajustes</button>

  <!-- Scripts -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch(err => console.error('Error registrando Service Worker:', err));
      });
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
